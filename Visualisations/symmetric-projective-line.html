      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) =&gt; {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) =&gt; {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll(&quot;*&quot;)) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) =&gt; {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) =&gt; {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host &amp;&amp; !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger &amp;&amp; !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () =&gt; {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();

        }
      };
      previous.addEventListener(&quot;click&quot;, () =&gt;
        select((active + panels.length - 1) % panels.length),
      );
      next.addEventListener(&quot;click&quot;, () =&gt;
        select((active + 1) % panels.length),
      );
      picker.addEventListener(&quot;keydown&quot;, (event) =&gt; {
        if (event.key === &quot;Escape&quot; &amp;&amp; picker.open) {

        } else if (event.key === &quot;ArrowUp&quot;) {

        } else if (picker.open &amp;&amp; event.key === &quot;Home&quot;) {

      window.addEventListener(&quot;resize&quot;, sizePicker);

        () =&gt; {
          document.removeEventListener(&quot;pointerdown&quot;, dismiss);
          document.removeEventListener(&quot;pointerup&quot;, endPointerSelection);
          document.removeEventListener(&quot;pointercancel&quot;, endPointerSelection);
          window.removeEventListener(&quot;blur&quot;, endPointerSelection);
          window.removeEventListener(&quot;resize&quot;, sizePicker);
        },

      select(0);

  })();

&lt;section style=&quot;margin-top:32px&quot;&gt;
&lt;hr&gt;&lt;h2&gt;The example and its verification&lt;/h2&gt;
&lt;p&gt;This example uses the definitions of symmetric graded algebras, symmetric quasi-coherent sheaves, and symmetric projective schemes in Sections 4, 5 and 7 of Grigory Garkusha’s &lt;em&gt;Symmetric quasi-coherent sheaves&lt;/em&gt;.
The calculation below is for the particular example displayed here; it is not a theorem quoted from that manuscript.&lt;/p&gt;
&lt;p&gt;Work over k = ℂ. The resulting ringed space is&lt;/p&gt;
&lt;p style=&quot;text-align:center&quot;&gt;(Proj&lt;sup&gt;Σ&lt;/sup&gt;E, 𝒪&lt;sup&gt;Σ&lt;/sup&gt;) ≅ (ℙ¹&lt;sub&gt;k&lt;/sub&gt;, j&lt;sub&gt;*&lt;/sub&gt;𝒪&lt;sub&gt;𝔸¹&lt;sub&gt;k&lt;/sub&gt;&lt;/sub&gt;), &amp;nbsp; j: D(z) = 𝔸¹&lt;sub&gt;k&lt;/sub&gt; ↪ ℙ¹&lt;sub&gt;k&lt;/sub&gt;, &amp;nbsp; t = y/z.&lt;/p&gt;
&lt;p&gt;The point ∞ = [1:0] remains in the space. The sheaf allows arbitrary finite-order poles there. Its stalk at ∞ is the field k(t). At each finite point a, the stalk is the usual local ring k[t]&lt;sub&gt;(t−a)&lt;/sub&gt;. This is a symmetric projective scheme in the manuscript’s ringed-space sense, but is not a scheme in the ordinary sense. Its structure sheaf is nonzero at every point.&lt;/p&gt;
&lt;details open&gt;&lt;summary&gt;The commutative symmetric algebra E&lt;/summary&gt;
&lt;p&gt;Let R = k[y,z], with y and z in degree one. Set M₀ = 0 and, for n ≥ 1, let M&lt;sub&gt;n&lt;/sub&gt; have basis e&lt;sub&gt;n,1&lt;/sub&gt;, …, e&lt;sub&gt;n,n&lt;/sub&gt;. The symmetric group Σ&lt;sub&gt;n&lt;/sub&gt; permutes this basis by σ(e&lt;sub&gt;n,i&lt;/sub&gt;) = e&lt;sub&gt;n,σ(i)&lt;/sub&gt;. Define E = R ⊕ M, with M² = 0. The left and right actions are&lt;/p&gt;
&lt;p style=&quot;text-align:center&quot;&gt;e&lt;sub&gt;n,i&lt;/sub&gt;y = e&lt;sub&gt;n+1,i&lt;/sub&gt;, &amp;nbsp; ye&lt;sub&gt;n,i&lt;/sub&gt; = e&lt;sub&gt;n+1,i+1&lt;/sub&gt;, &amp;nbsp; zM = Mz = 0.&lt;/p&gt;
&lt;p&gt;The actions extend to R. Put x = e&lt;sub&gt;1,1&lt;/sub&gt;; then e&lt;sub&gt;n,i&lt;/sub&gt; = y&lt;sup&gt;i−1&lt;/sup&gt;xy&lt;sup&gt;n−i&lt;/sup&gt;. Thus xy and yx are distinct, while the block transposition exchanges them. The multiplication is commutative in symmetric sequences, although the underlying algebra is not commutative. An equivalent presentation is&lt;/p&gt;
&lt;p style=&quot;text-align:center&quot;&gt;E = T(kx ⊕ ky ⊕ kz)/(x², xz, yz − zy)&lt;sup&gt;Σ&lt;/sup&gt;.&lt;/p&gt;
&lt;p&gt;The superscript means the symmetric ideal generated by these relations. In each degree, words containing two x’s vanish, as do words containing both x and z. Words without x give R; words containing one x and otherwise y’s give the indicated permutation representation M&lt;sub&gt;n&lt;/sub&gt;. This verifies the presentation and finite symmetric generation. The orbit control displays the four distinct basis words of M₄.&lt;/p&gt;
&lt;/details&gt;
&lt;details open&gt;&lt;summary&gt;The topological space&lt;/summary&gt;
&lt;p&gt;Every prime symmetric ideal contains M, because each m ∈ M satisfies m² = 0. Passing to E/M = R therefore identifies the proper prime symmetric ideals avoiding E&lt;sub&gt;+&lt;/sub&gt; with the homogeneous projective primes of R. This identifies the Zariski spaces Proj&lt;sup&gt;Σ&lt;/sup&gt;E and ℙ¹&lt;sub&gt;k&lt;/sub&gt;.&lt;/p&gt;
&lt;p&gt;The sphere in the visualization arranges the complex closed points using inverse stereographic projection. It does not represent the Zariski topology by the Euclidean topology of a sphere. The generic point η is shown separately. The dashed arrow means η specializes to the selected closed point; it is not a path through intermediate points. The pole crosses refer to the ordinary divisor of the selected rational function.&lt;/p&gt;
&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why the symmetric localization forces z to be invertible&lt;/summary&gt;
&lt;p&gt;Write q: Gr&lt;sup&gt;Σ&lt;/sup&gt;E → QGr&lt;sup&gt;Σ&lt;/sup&gt;E and L = q(E[1]). The paper’s evaluation maps make L invertible. Set K = E/(M,z) = k[y], with trivial symmetric actions, and A = q(K).&lt;/p&gt;
&lt;p&gt;The residue module k concentrated in degree zero is symmetric torsion: it is the cokernel of the evaluation map a₁, whose image is E&lt;sub&gt;+&lt;/sub&gt;. A direct calculation in symmetric modules gives&lt;/p&gt;
&lt;p style=&quot;text-align:center&quot;&gt;E[1] ∧&lt;sub&gt;E&lt;/sub&gt; K ≅ K ⊕ K ⊕ k[0].&lt;/p&gt;
&lt;p&gt;To see the decomposition, write E[1]&lt;sub&gt;n&lt;/sub&gt; = E&lt;sub&gt;n+1&lt;/sub&gt;, with Σ&lt;sub&gt;n&lt;/sub&gt; acting on the last n positions. Modulo the action of the ideal (M,z), the two persistent basis elements are xyⁿ and y&lt;sup&gt;n+1&lt;/sup&gt;. The element z survives only in degree zero. All positions of x after the first are killed by right multiplication by x followed by the Σ&lt;sub&gt;n&lt;/sub&gt;-action. The restricted symmetric actions on the two persistent summands are trivial.&lt;/p&gt;
&lt;p&gt;Applying q yields L ⊠ A ≅ A ⊕ A. Regard this as an isomorphism of A-modules in QGr&lt;sup&gt;Σ&lt;/sup&gt;E. The left side is invertible as an A-module. Hence its endomorphism ring is isomorphic to End&lt;sub&gt;A&lt;/sub&gt;(A), a commutative ring. The right side has endomorphism ring M₂(End&lt;sub&gt;A&lt;/sub&gt;(A)). A two-by-two matrix ring is commutative only when its coefficient ring is zero. Thus A = 0.&lt;/p&gt;
&lt;p&gt;There is also an explicit isomorphism M ≅ F₁E ∧&lt;sub&gt;E&lt;/sub&gt; K: its degree-n part is the induced permutation module on the possible position of x. Consequently q(M) = 0. For every n ≥ 0, restricting the symmetric action gives&lt;/p&gt;
&lt;p style=&quot;text-align:center&quot;&gt;M[n] ≅ K&lt;sup&gt;⊕n&lt;/sup&gt; ⊕ M,&lt;/p&gt;
&lt;p&gt;so q(M[n]) = 0 as well. This argument uses the explicit decomposition; it does not assume that q commutes with positive shifts of arbitrary modules.&lt;/p&gt;
&lt;p&gt;Multiplication by z defines maps E[n] → E[n+1]. Their kernels are M[n]. Their cokernels fit into exact sequences with submodule M[n+1] and quotient K, since R[n+1]/zR[n] ≅ K. Both kernel and cokernel are therefore killed by q. Every such z-map is a stable equivalence.&lt;/p&gt;
&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;The quotient category and the structure sheaf&lt;/summary&gt;
&lt;p&gt;For a k[t]-module N, let I(N) be the symmetric E-module with I(N)&lt;sub&gt;n&lt;/sub&gt; = N in every degree, trivial Σ&lt;sub&gt;n&lt;/sub&gt;-actions, and generator actions z = id, y = t, x = 0. Its left adjoint is the exact functor&lt;/p&gt;
&lt;p style=&quot;text-align:center&quot;&gt;F(H) = colim&lt;sub&gt;n&lt;/sub&gt; (H&lt;sub&gt;n&lt;/sub&gt;)&lt;sub&gt;Σ&lt;sub&gt;n&lt;/sub&gt;&lt;/sub&gt;,&lt;/p&gt;
&lt;p&gt;where transitions are multiplication by z and t acts by multiplication by y followed by identification in the colimit. Exactness uses characteristic zero for the coinvariants. The functor F sends all evaluation maps a&lt;sub&gt;n&lt;/sub&gt; to isomorphisms and respects the tensor shifts. It therefore factors through the symmetric localization.&lt;/p&gt;
&lt;p&gt;The telescope of E → E[1] → E[2] → … under z is I(k[t]): multiplication by z kills M, while the polynomial part becomes the degreewise localization at z. The preceding calculation shows q(E) ≅ q(I(k[t])). Moreover, the map F&lt;sub&gt;n&lt;/sub&gt;E → E represented by zⁿ is a stable equivalence: it is the composite of zⁿ: E → E[n], tensored with F&lt;sub&gt;n&lt;/sub&gt;E, and the evaluation a&lt;sub&gt;n&lt;/sub&gt;.&lt;/p&gt;
&lt;p&gt;Thus the unit H → I(F(H)) is a stable equivalence on the free generators F&lt;sub&gt;n&lt;/sub&gt;E. Both q and qIF are exact and preserve coproducts, so a presentation by these free generators proves the same for every H. Since FI is the identity, this gives&lt;/p&gt;
&lt;p style=&quot;text-align:center&quot;&gt;QGr&lt;sup&gt;Σ&lt;/sup&gt;E ≃ Mod k[t], &amp;nbsp; q(E) ↦ k[t].&lt;/p&gt;
&lt;p&gt;It remains to check the localizations defining the sheaf, rather than infer it from the global category. For a symmetric ideal J ⊂ E, let J̄ be its image in R. Under F, the maps&lt;/p&gt;
&lt;p style=&quot;text-align:center&quot;&gt;d&lt;sub&gt;n,J&lt;/sub&gt;: J[n] ∧&lt;sub&gt;E&lt;/sub&gt; F&lt;sub&gt;n&lt;/sub&gt;E → E&lt;/p&gt;
&lt;p&gt;become the inclusions (J̄[z&lt;sup&gt;−1&lt;/sup&gt;])₀ → k[t], independently of n after z trivializes the shifts. The filter used in Section 7 for a standard open D therefore gives the ordinary localization on D ∩ D(z). One may check this on D(f), with f homogeneous in k[y,z]; its image is f(t,1), and the local endomorphism ring is k[t]&lt;sub&gt;f(t,1)&lt;/sub&gt;. These opens form a basis, and the restriction maps are the ordinary localization maps.&lt;/p&gt;
&lt;p&gt;Hence the endomorphism rings in the paper’s definition give 𝒪&lt;sup&gt;Σ&lt;/sup&gt;(D) = 𝒪&lt;sub&gt;𝔸¹&lt;/sub&gt;(D ∩ 𝔸¹), compatibly with restrictions. Sheafification yields 𝒪&lt;sup&gt;Σ&lt;/sup&gt; = j&lt;sub&gt;*&lt;/sub&gt;𝒪&lt;sub&gt;𝔸¹&lt;/sub&gt;.&lt;/p&gt;
&lt;/details&gt;
&lt;details open&gt;&lt;summary&gt;What changes at infinity&lt;/summary&gt;
&lt;p&gt;Put u = z/y = 1/t near ∞. For the ordinary projective line, 𝒪&lt;sub&gt;∞&lt;/sub&gt; = k[u]&lt;sub&gt;(u)&lt;/sub&gt;. For the symmetric structure,&lt;/p&gt;
&lt;p style=&quot;text-align:center&quot;&gt;𝒪&lt;sup&gt;Σ&lt;/sup&gt;&lt;sub&gt;∞&lt;/sub&gt; = colim&lt;sub&gt;∞∈D&lt;/sub&gt; 𝒪(D ∩ 𝔸¹) = k(t).&lt;/p&gt;
&lt;p&gt;Every rational function has only finitely many finite poles, which can be excluded by a Zariski neighbourhood of ∞. Thus every nonzero rational function is a unit in the symmetric stalk at ∞. In particular, t is admitted there, and 1/t is also a unit—even though 1/t has an ordinary zero at infinity.&lt;/p&gt;
&lt;p&gt;Being a regular germ in this stalk does not mean that the rational function has a complex value at infinity. The residue field at this point is k(t), not k. There is no k-algebra evaluation homomorphism k(t) → k: if t mapped to a ∈ k, the nonzero invertible element t − a would map to zero.&lt;/p&gt;
&lt;p&gt;The three standard-open rings are 𝒪&lt;sup&gt;Σ&lt;/sup&gt;(D(z)) = k[t], 𝒪&lt;sup&gt;Σ&lt;/sup&gt;(D(y)) = k[t,t&lt;sup&gt;−1&lt;/sup&gt;], and 𝒪&lt;sup&gt;Σ&lt;/sup&gt;(D(yz)) = k[t,t&lt;sup&gt;−1&lt;/sup&gt;]. The point ∞ belongs to D(y), although its stalk is already the full function field. Globally, Γ(ℙ¹,𝒪&lt;sup&gt;Σ&lt;/sup&gt;) = k[t], whereas Γ(ℙ¹,𝒪&lt;sub&gt;ℙ¹&lt;/sub&gt;) = k.&lt;/p&gt;
&lt;/details&gt;
&lt;details open&gt;&lt;summary&gt;Why this ringed space is not an ordinary scheme&lt;/summary&gt;
&lt;p&gt;In a scheme, the points of Spec 𝒪&lt;sub&gt;X,p&lt;/sub&gt; correspond to the generizations of p. Here ∞ has two generizations, η and ∞, but Spec 𝒪&lt;sup&gt;Σ&lt;/sup&gt;&lt;sub&gt;∞&lt;/sub&gt; = Spec k(t) has only one point. Therefore the ringed space cannot be an ordinary scheme.&lt;/p&gt;
&lt;p&gt;This obstruction uses both topology and sheaf. Merely choosing a noncommutative symmetric algebra would not suffice: some such algebras still produce ordinary projective schemes.&lt;/p&gt;
&lt;/details&gt;
&lt;p&gt;Reference: G. Garkusha, &lt;a href=&quot;https://arxiv.org/abs/2501.15569&quot;&gt;&lt;em&gt;Symmetric quasi-coherent sheaves&lt;/em&gt;&lt;/a&gt;. The definitions used here follow the uploaded September manuscript.&lt;/p&gt;
&lt;/section&gt;

&lt;/body&gt;
&lt;/html&gt;
"></iframe>
<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
