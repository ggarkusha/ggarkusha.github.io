&lt;section style=&quot;margin-top:32px&quot;&gt;
&lt;hr&gt;&lt;h2&gt;The framed correspondence&lt;/h2&gt;
&lt;p&gt;Work over ℂ. This is the explicit level-one framed correspondence from ℂ’s affine line A¹&lt;sub&gt;s&lt;/sub&gt; to Spec ℂ given by&lt;/p&gt;
&lt;p style=&quot;text-align:center&quot;&gt;U = A¹&lt;sub&gt;s&lt;/sub&gt; × A¹&lt;sub&gt;t&lt;/sub&gt;, &amp;nbsp; p = id&lt;sub&gt;U&lt;/sub&gt;, &amp;nbsp; φ(s,t) = t² − (2s − 1), &amp;nbsp; g: U → Spec ℂ.&lt;/p&gt;
&lt;p&gt;Its support is the closed set Z = {φ = 0}. In particular, p is an étale neighbourhood map: it is the identity of A¹&lt;sub&gt;A¹&lt;sub&gt;s&lt;/sub&gt;&lt;/sub&gt;. It is also quasi-finite, with a single point in every geometric fibre. There are no excluded points in this example. These data satisfy the definition of an explicit framed correspondence in &lt;a href=&quot;https://pubs.ams.org/JAMS/2021-34-01/S0894-0347-2020-00958-4&quot;&gt;Garkusha–Panin, &lt;em&gt;Framed motives of algebraic varieties (after V. Voevodsky)&lt;/em&gt;, Definition 2.1&lt;/a&gt;.&lt;/p&gt;
&lt;h3&gt;Finiteness throughout the homotopy&lt;/h3&gt;
&lt;p&gt;The zero scheme 𝒵 = V(φ) has coordinate ring ℂ[s,t]/(t² − 2s + 1). As a module over ℂ[s], it is free with basis 1,t. Thus 𝒵 → A¹&lt;sub&gt;s&lt;/sub&gt; is finite flat of degree two over the whole algebraic parameter line. Restricting to s = 0 and s = 1 gives framed correspondences from Spec ℂ to itself, joined by this A¹-homotopy.&lt;/p&gt;
&lt;p&gt;At s = 0 the two zeros are ±i; at s = 1 they are ±1. At s = ½, the zero scheme is Spec ℂ[t]/(t²), of length two. Its underlying support is one point. The diagram distinguishes multiplicity from the number of geometric support points.&lt;/p&gt;
&lt;h3&gt;What the 3D model represents&lt;/h3&gt;
&lt;p&gt;Write t = a + ib and restrict the parameter s to the real interval [0,1]. The axes are (a,b,s), and the equations become&lt;/p&gt;
&lt;p style=&quot;text-align:center&quot;&gt;Re φ = a² − b² − 2s + 1 = 0, &amp;nbsp; Im φ = 2ab = 0.&lt;/p&gt;
&lt;p&gt;The translucent saddle is only the first equation. The highlighted curves impose both: the imaginary branches have a = 0 and s = (1 − b²)/2; the real branches have b = 0 and s = (a² + 1)/2. The moving plane selects a parameter value, and the highlighted points are the zeros in that fibre. Drag to rotate, use the rotation and elevation sliders, or run the homotopy once. The double-point button selects s = ½ exactly.&lt;/p&gt;
&lt;p&gt;This is a real three-dimensional slice of U(ℂ), which has real dimension four. The algebraic homotopy is defined for all complex s. The apparent meeting of four arms in the slice is not a singularity of the total complex zero scheme: 𝒵 ≅ A¹&lt;sub&gt;t&lt;/sub&gt;, via s = (t² + 1)/2.&lt;/p&gt;
&lt;h3&gt;The framing at the collision&lt;/h3&gt;
&lt;p&gt;At a simple zero t ≠ 0, the relative derivative dφ/dt = 2t is invertible. The solid and dashed arrows show the directions of (2t)&lt;sup&gt;−1&lt;/sup&gt; and i(2t)&lt;sup&gt;−1&lt;/sup&gt; in the t-plane. Their lengths are normalized for display; they indicate the real and imaginary directions of the linearized complex framing.&lt;/p&gt;
&lt;p&gt;At t = 0 these inverse-derivative arrows are undefined and are omitted. The framing function φ is still valid. It generates the ideal I of the zero scheme and supplies a basis of I/I² over its coordinate ring, including in the double-point fibre. The definition of a framed correspondence does not require φ to be étale.&lt;/p&gt;
&lt;p&gt;The ramified map here is the finite support projection 𝒵 → A¹&lt;sub&gt;s&lt;/sub&gt;. It must not be confused with the étale neighbourhood map p = id. The collision does not invalidate the framed homotopy.&lt;/p&gt;
&lt;/section&gt;

  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
