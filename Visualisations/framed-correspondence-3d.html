    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
&lt;/script&gt;
&lt;div id=&quot;framed-correspondence-3d&quot;&gt;
  &lt;h3&gt;The total space of the framed homotopy&lt;/h3&gt;
  &lt;p class=&quot;fr3-intro&quot;&gt;A level-one framed correspondence from the parameter line A¹&lt;sub&gt;s&lt;/sub&gt; to A¹&lt;sub&gt;y&lt;/sub&gt;, giving a framed homotopy between a double zero at &lt;i&gt;s&lt;/i&gt; = 0 and two simple zeros at &lt;i&gt;s&lt;/i&gt; = 1. The defining data and verification appear &lt;a href=&quot;#fr3-mathematics&quot;&gt;below the model&lt;/a&gt;.&lt;/p&gt;
  &lt;p class=&quot;fr3-intro text-small&quot;&gt;Drag to rotate. Move the slice slider to vary &lt;i&gt;s&lt;/i&gt;, or open “View controls” to adjust the rotation and elevation.&lt;/p&gt;
  &lt;div class=&quot;viz-controls&quot;&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;fr3-parameter&quot;&gt;Slice s = &lt;output id=&quot;fr3-value&quot; class=&quot;tabular-nums&quot; for=&quot;fr3-parameter&quot;&gt;0.64&lt;/output&gt;
      &lt;input class=&quot;form-range&quot; id=&quot;fr3-parameter&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;1&quot; step=&quot;0.01&quot; value=&quot;0.64&quot; aria-label=&quot;Slice parameter s&quot;&gt;
    &lt;/label&gt;
  &lt;/div&gt;
  &lt;div id=&quot;fr3-stage&quot;&gt;
    &lt;svg class=&quot;fr3-scene cursor-interaction&quot; role=&quot;img&quot; aria-labelledby=&quot;fr3-title fr3-description&quot;&gt;&lt;/svg&gt;
  &lt;/div&gt;
  &lt;div class=&quot;viz-row text-small&quot; aria-label=&quot;Legend&quot;&gt;
    &lt;span class=&quot;fr3-key&quot;&gt;&lt;span class=&quot;fr3-swatch fr3-support&quot;&gt;&lt;/span&gt;Retained support: u = 1&lt;/span&gt;
    &lt;span class=&quot;fr3-key&quot;&gt;&lt;span class=&quot;fr3-swatch fr3-excluded&quot;&gt;&lt;/span&gt;Removed: u = 0, −1&lt;/span&gt;
    &lt;span class=&quot;fr3-key&quot;&gt;&lt;span class=&quot;fr3-swatch fr3-slice&quot;&gt;&lt;/span&gt;Moving slice&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;text-small&quot; id=&quot;fr3-detail&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;details&gt;
    &lt;summary&gt;View controls&lt;/summary&gt;
    &lt;div class=&quot;viz-controls&quot;&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;fr3-azimuth&quot;&gt;Rotation &lt;output class=&quot;tabular-nums&quot; id=&quot;fr3-az-value&quot; for=&quot;fr3-azimuth&quot;&gt;−38°&lt;/output&gt;
        &lt;input class=&quot;form-range&quot; id=&quot;fr3-azimuth&quot; type=&quot;range&quot; min=&quot;-180&quot; max=&quot;180&quot; step=&quot;1&quot; value=&quot;-38&quot;&gt;
      &lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;fr3-elevation&quot;&gt;Elevation &lt;output class=&quot;tabular-nums&quot; id=&quot;fr3-el-value&quot; for=&quot;fr3-elevation&quot;&gt;27°&lt;/output&gt;
        &lt;input class=&quot;form-range&quot; id=&quot;fr3-elevation&quot; type=&quot;range&quot; min=&quot;-70&quot; max=&quot;80&quot; step=&quot;1&quot; value=&quot;27&quot;&gt;
      &lt;/label&gt;
    &lt;/div&gt;
  &lt;/details&gt;
&lt;section class=&quot;fr3-notes&quot; id=&quot;fr3-mathematics&quot; aria-labelledby=&quot;fr3-math-title&quot;&gt;
  &lt;h2 id=&quot;fr3-math-title&quot;&gt;The framed correspondence and its homotopy&lt;/h2&gt;
  &lt;p&gt;Work over &lt;i&gt;k&lt;/i&gt; = ℝ, and let &lt;i&gt;Y&lt;/i&gt; = A¹&lt;sub&gt;y&lt;/sub&gt;. For each &lt;i&gt;a&lt;/i&gt; ∈ &lt;i&gt;k&lt;/i&gt;, the fibre at &lt;i&gt;s&lt;/i&gt; = &lt;i&gt;a&lt;/i&gt; gives a level-one framed correspondence Φ&lt;sub&gt;a&lt;/sub&gt; from Spec &lt;i&gt;k&lt;/i&gt; to &lt;i&gt;Y&lt;/i&gt;. The parameter &lt;i&gt;s&lt;/i&gt; assembles these fibres into one framed correspondence over the entire affine line.&lt;/p&gt;

  &lt;h3&gt;1. The defining data&lt;/h3&gt;
  &lt;p&gt;In A¹&lt;sub&gt;s&lt;/sub&gt; × A¹&lt;sub&gt;x&lt;/sub&gt;, define the finite zero scheme&lt;/p&gt;
  &lt;div class=&quot;fr3-equation&quot;&gt;&lt;i&gt;Z&lt;/i&gt; = V(&lt;i&gt;x&lt;/i&gt;² − &lt;i&gt;s&lt;/i&gt;) = Spec &lt;i&gt;k&lt;/i&gt;[&lt;i&gt;s&lt;/i&gt;, &lt;i&gt;x&lt;/i&gt;]/(&lt;i&gt;x&lt;/i&gt;² − &lt;i&gt;s&lt;/i&gt;).&lt;/div&gt;
  &lt;p&gt;Its underlying closed set |&lt;i&gt;Z&lt;/i&gt;| is the support. Take the étale neighbourhood&lt;/p&gt;
  &lt;div class=&quot;fr3-equation&quot;&gt;&lt;i&gt;U&lt;/i&gt; = {( &lt;i&gt;s&lt;/i&gt;, &lt;i&gt;x&lt;/i&gt;, &lt;i&gt;u&lt;/i&gt; ) : &lt;i&gt;u&lt;/i&gt;² = 1 + &lt;i&gt;x&lt;/i&gt;² − &lt;i&gt;s&lt;/i&gt;,&amp;ensp;&lt;i&gt;u&lt;/i&gt;(&lt;i&gt;u&lt;/i&gt; + 1) ≠ 0}.&lt;/div&gt;
  &lt;p&gt;The neighbourhood map, its lift of the support, the framing, and the target map are&lt;/p&gt;
  &lt;div class=&quot;fr3-equation&quot;&gt;&lt;i&gt;p&lt;/i&gt;(&lt;i&gt;s&lt;/i&gt;, &lt;i&gt;x&lt;/i&gt;, &lt;i&gt;u&lt;/i&gt;) = (&lt;i&gt;s&lt;/i&gt;, &lt;i&gt;x&lt;/i&gt;),&amp;emsp;τ(&lt;i&gt;s&lt;/i&gt;, &lt;i&gt;x&lt;/i&gt;) = (&lt;i&gt;s&lt;/i&gt;, &lt;i&gt;x&lt;/i&gt;, 1),&lt;/div&gt;
  &lt;div class=&quot;fr3-equation&quot;&gt;φ(&lt;i&gt;s&lt;/i&gt;, &lt;i&gt;x&lt;/i&gt;, &lt;i&gt;u&lt;/i&gt;) = &lt;i&gt;x&lt;/i&gt;² − &lt;i&gt;s&lt;/i&gt;,&amp;emsp;&lt;i&gt;g&lt;/i&gt;(&lt;i&gt;s&lt;/i&gt;, &lt;i&gt;x&lt;/i&gt;, &lt;i&gt;u&lt;/i&gt;) = &lt;i&gt;x&lt;/i&gt;² ∈ A¹&lt;sub&gt;y&lt;/sub&gt;.&lt;/div&gt;
  &lt;p&gt;Thus the quadruple defines&lt;/p&gt;
  &lt;div class=&quot;fr3-equation&quot;&gt;&lt;i&gt;H&lt;/i&gt; = (|&lt;i&gt;Z&lt;/i&gt;|, &lt;i&gt;U&lt;/i&gt;, φ, &lt;i&gt;g&lt;/i&gt;) ∈ Fr&lt;sub&gt;1&lt;/sub&gt;(A¹&lt;sub&gt;s&lt;/sub&gt;, A¹&lt;sub&gt;y&lt;/sub&gt;).&lt;/div&gt;

  &lt;h3&gt;2. Why these data form a framed correspondence&lt;/h3&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;strong&gt;Finite support.&lt;/strong&gt; The algebra &lt;i&gt;k&lt;/i&gt;[&lt;i&gt;s&lt;/i&gt;, &lt;i&gt;x&lt;/i&gt;]/(&lt;i&gt;x&lt;/i&gt;² − &lt;i&gt;s&lt;/i&gt;) is free of rank two over &lt;i&gt;k&lt;/i&gt;[&lt;i&gt;s&lt;/i&gt;], with basis 1, &lt;i&gt;x&lt;/i&gt;. Hence &lt;i&gt;Z&lt;/i&gt; → A¹&lt;sub&gt;s&lt;/sub&gt; is finite flat of degree two.&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;Étale neighbourhood.&lt;/strong&gt; The defining polynomial in &lt;i&gt;u&lt;/i&gt; has derivative 2&lt;i&gt;u&lt;/i&gt;, which is invertible on &lt;i&gt;U&lt;/i&gt;. Therefore &lt;i&gt;p&lt;/i&gt; is étale. Over &lt;i&gt;Z&lt;/i&gt;, its equation becomes (&lt;i&gt;u&lt;/i&gt; − 1)(&lt;i&gt;u&lt;/i&gt; + 1) = 0. Since &lt;i&gt;u&lt;/i&gt; + 1 is invertible, &lt;i&gt;p&lt;/i&gt;&lt;sup&gt;−1&lt;/sup&gt;(&lt;i&gt;Z&lt;/i&gt;) = τ(&lt;i&gt;Z&lt;/i&gt;) scheme-theoretically.&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;Framing and target.&lt;/strong&gt; The zero scheme V(φ) in &lt;i&gt;U&lt;/i&gt; is exactly τ(&lt;i&gt;Z&lt;/i&gt;), and &lt;i&gt;g&lt;/i&gt; is a regular map on all of &lt;i&gt;U&lt;/i&gt;. Its restriction to V(φ) has value &lt;i&gt;y&lt;/i&gt; = &lt;i&gt;s&lt;/i&gt;.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;h3&gt;3. The framed homotopy in s&lt;/h3&gt;
  &lt;p&gt;For the inclusion &lt;i&gt;i&lt;/i&gt;&lt;sub&gt;a&lt;/sub&gt;: Spec &lt;i&gt;k&lt;/i&gt; → A¹&lt;sub&gt;s&lt;/sub&gt; at &lt;i&gt;s&lt;/i&gt; = &lt;i&gt;a&lt;/i&gt;, write&lt;/p&gt;
  &lt;div class=&quot;fr3-equation&quot;&gt;Φ&lt;sub&gt;a&lt;/sub&gt; = &lt;i&gt;i&lt;/i&gt;&lt;sub&gt;a&lt;/sub&gt;&lt;sup&gt;*&lt;/sup&gt;&lt;i&gt;H&lt;/i&gt; = (|&lt;i&gt;Z&lt;/i&gt;&lt;sub&gt;a&lt;/sub&gt;|, &lt;i&gt;U&lt;/i&gt;&lt;sub&gt;a&lt;/sub&gt;, &lt;i&gt;x&lt;/i&gt;² − &lt;i&gt;a&lt;/i&gt;, &lt;i&gt;x&lt;/i&gt;²) ∈ Fr&lt;sub&gt;1&lt;/sub&gt;(Spec &lt;i&gt;k&lt;/i&gt;, A¹&lt;sub&gt;y&lt;/sub&gt;).&lt;/div&gt;
  &lt;p&gt;Here &lt;i&gt;U&lt;/i&gt;&lt;sub&gt;a&lt;/sub&gt; is obtained by setting &lt;i&gt;s&lt;/i&gt; = &lt;i&gt;a&lt;/i&gt; in the defining equation and retaining the condition &lt;i&gt;u&lt;/i&gt;(&lt;i&gt;u&lt;/i&gt; + 1) ≠ 0. By definition, &lt;i&gt;H&lt;/i&gt; is an algebraic A¹-homotopy of framed correspondences from Φ&lt;sub&gt;0&lt;/sub&gt; to Φ&lt;sub&gt;1&lt;/sub&gt;:&lt;/p&gt;
  &lt;div class=&quot;fr3-equation&quot;&gt;&lt;i&gt;i&lt;/i&gt;&lt;sub&gt;0&lt;/sub&gt;&lt;sup&gt;*&lt;/sup&gt;&lt;i&gt;H&lt;/i&gt; = Φ&lt;sub&gt;0&lt;/sub&gt;,&amp;emsp;&lt;i&gt;i&lt;/i&gt;&lt;sub&gt;1&lt;/sub&gt;&lt;sup&gt;*&lt;/sup&gt;&lt;i&gt;H&lt;/i&gt; = Φ&lt;sub&gt;1&lt;/sub&gt;.&lt;/div&gt;
  &lt;div class=&quot;table-responsive&quot;&gt;
    &lt;table class=&quot;table table-sm&quot;&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Endpoint&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Zero scheme&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Framing&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Target on the zero scheme&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;&lt;i&gt;s&lt;/i&gt; = 0&lt;/th&gt;&lt;td&gt;Spec &lt;i&gt;k&lt;/i&gt;[&lt;i&gt;x&lt;/i&gt;]/(&lt;i&gt;x&lt;/i&gt;²): one double zero&lt;/td&gt;&lt;td&gt;φ&lt;sub&gt;0&lt;/sub&gt; = &lt;i&gt;x&lt;/i&gt;²&lt;/td&gt;&lt;td&gt;&lt;i&gt;y&lt;/i&gt; = 0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;&lt;i&gt;s&lt;/i&gt; = 1&lt;/th&gt;&lt;td&gt;{−1, 1}: two reduced points&lt;/td&gt;&lt;td&gt;φ&lt;sub&gt;1&lt;/sub&gt; = &lt;i&gt;x&lt;/i&gt;² − 1&lt;/td&gt;&lt;td&gt;&lt;i&gt;y&lt;/i&gt; = 1 at both points&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;
  &lt;p&gt;The double zero at &lt;i&gt;s&lt;/i&gt; = 0 is permitted: étaleness is required of the neighbourhood map &lt;i&gt;p&lt;/i&gt;, whereas &lt;i&gt;Z&lt;/i&gt; → A¹&lt;sub&gt;s&lt;/sub&gt; is required to be finite. In this example it is also flat, so the length of every zero-scheme fibre remains two.&lt;/p&gt;

  &lt;h3&gt;4. Reading the three-dimensional picture&lt;/h3&gt;
  &lt;p&gt;The mesh displays a bounded part of the real surface &lt;i&gt;s&lt;/i&gt; = 1 + &lt;i&gt;x&lt;/i&gt;² − &lt;i&gt;u&lt;/i&gt;² before the two dashed curves are deleted. Those curves are &lt;i&gt;u&lt;/i&gt; = 0, &lt;i&gt;s&lt;/i&gt; = 1 + &lt;i&gt;x&lt;/i&gt;² and &lt;i&gt;u&lt;/i&gt; = −1, &lt;i&gt;s&lt;/i&gt; = &lt;i&gt;x&lt;/i&gt;². The solid support curve is the lift τ(&lt;i&gt;Z&lt;/i&gt;): &lt;i&gt;u&lt;/i&gt; = 1, &lt;i&gt;s&lt;/i&gt; = &lt;i&gt;x&lt;/i&gt;². A horizontal slice selects a fibre &lt;i&gt;U&lt;/i&gt;&lt;sub&gt;a&lt;/sub&gt;; its retained support points are (&lt;i&gt;x&lt;/i&gt;, &lt;i&gt;u&lt;/i&gt;) = (±√&lt;i&gt;a&lt;/i&gt;, 1) for &lt;i&gt;a&lt;/i&gt; &amp;gt; 0.&lt;/p&gt;
  &lt;p&gt;The slider displays the real interval 0 ≤ &lt;i&gt;s&lt;/i&gt; ≤ 1. The framed homotopy itself is defined over the whole scheme A¹&lt;sub&gt;s&lt;/sub&gt;. The point at &lt;i&gt;s&lt;/i&gt; = 0 represents a zero scheme of length two; this scheme structure is recorded by the framing &lt;i&gt;x&lt;/i&gt;² and the multiplicity label.&lt;/p&gt;
&lt;/section&gt;
&lt;style&gt;
  #framed-correspondence-3d .fr3-intro { max-width: 76ch; }
  #framed-correspondence-3d .fr3-notes { margin-top: 2rem; max-width: 82ch; }
  #framed-correspondence-3d .fr3-notes h3 { margin-top: 1.6rem; }
  #framed-correspondence-3d .fr3-notes li { margin-bottom: 0.75rem; }
  #framed-correspondence-3d .fr3-equation { margin: 1rem 0; padding-inline: 0.6rem; font-family: Cambria, &quot;STIX Two Text&quot;, &quot;Times New Roman&quot;, serif; font-size: 1.12em; overflow-wrap: anywhere; }
  #framed-correspondence-3d .fr3-notes td, #framed-correspondence-3d .fr3-notes th { white-space: normal; vertical-align: top; }
&lt;/style&gt;

&lt;/div&gt;
&lt;style&gt;
  #framed-correspondence-3d { color: var(--foreground); }
  #framed-correspondence-3d .fr3-scene { display: block; width: 100%; touch-action: none; user-select: none; }
  #framed-correspondence-3d .fr3-scene text { fill: var(--foreground); font-size: 12px; font-weight: 400; }
  #framed-correspondence-3d .fr3-key { display: inline-flex; align-items: center; gap: 7px; }
  #framed-correspondence-3d .fr3-swatch { display: inline-block; width: 20px; height: 0; border-top: 2px solid var(--viz-series-1); }
  #framed-correspondence-3d .fr3-excluded { border-color: var(--viz-series-2); border-top-style: dashed; }
  #framed-correspondence-3d .fr3-slice { border-color: var(--viz-series-3); }
  #framed-correspondence-3d #fr3-detail { margin: 10px 0; }
&lt;/style&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;framed-correspondence-3d&#x27;);
  const stage = root.querySelector(&#x27;#fr3-stage&#x27;);
  const svg = root.querySelector(&#x27;.fr3-scene&#x27;);
  const parameter = root.querySelector(&#x27;#fr3-parameter&#x27;);
  const azimuth = root.querySelector(&#x27;#fr3-azimuth&#x27;);
  const elevation = root.querySelector(&#x27;#fr3-elevation&#x27;);
  const value = root.querySelector(&#x27;#fr3-value&#x27;);
  const azValue = root.querySelector(&#x27;#fr3-az-value&#x27;);
  const elValue = root.querySelector(&#x27;#fr3-el-value&#x27;);
  const detail = root.querySelector(&#x27;#fr3-detail&#x27;);
  const ns = &#x27;http://www.w3.org/2000/svg&#x27;;
  const supportColor = &#x27;var(--viz-series-1)&#x27;;
  const excludedColor = &#x27;var(--viz-series-2)&#x27;;
  const sliceColor = &#x27;var(--viz-series-3)&#x27;;
  const foreground = &#x27;var(--foreground)&#x27;;
  const neutral = &#x27;var(--muted-foreground)&#x27;;
  const halfX = 1.25, halfU = 1.35;
  const sMin = 1 - halfU * halfU;
  const sMax = 1 + halfX * halfX;
  const centreS = (sMin + sMax) / 2;
  const point = (x, u) =&gt; [x, u, 1 + x * x - u * u];
  const fixed = [];
  const n = 24;
  const mean = values =&gt; values.reduce((a, b) =&gt; a + b, 0) / values.length;
  for (let i = 0; i &lt; n; i++) {
    const x0 = -halfX + 2 * halfX * i / n;
    const x1 = -halfX + 2 * halfX * (i + 1) / n;
    for (let j = 0; j &lt; n; j++) {
      const u0 = -halfU + 2 * halfU * j / n;
      const u1 = -halfU + 2 * halfU * (j + 1) / n;
      const cx = (x0 + x1) / 2, cu = (u0 + u1) / 2;
      const light = Math.abs((0.7 * cx - 0.9 * cu + 1) / Math.sqrt(4 * cx * cx + 4 * cu * cu + 1));
      fixed.push({ kind: &#x27;polygon&#x27;, points: [point(x0, u0), point(x1, u0), point(x1, u1), point(x0, u1)], fill: neutral, opacity: 0.07 + 0.07 * Math.min(1, light) });
    }
  }
  function line(points, stroke, width = 1, opacity = 1) {
    return { kind: &#x27;line&#x27;, points, stroke, width, opacity };
  }
  for (let j = 0; j &lt;= 12; j++) {
    const u = -halfU + 2 * halfU * j / 12;
    const x = -halfX + 2 * halfX * j / 12;
    for (let i = 0; i &lt; 48; i++) {
      const a = i / 48, b = (i + 1) / 48;
      fixed.push(line([point(-halfX + 2 * halfX * a, u), point(-halfX + 2 * halfX * b, u)], neutral, 0.7, 0.3));
      fixed.push(line([point(x, -halfU + 2 * halfU * a), point(x, -halfU + 2 * halfU * b)], neutral, 0.7, 0.3));
    }
  }
  for (const u of [1, 0, -1]) {
    for (let i = 0; i &lt; 120; i++) {
      if (u !== 1 &amp;&amp; i % 10 &gt;= 6) continue;
      const xa = -halfX + 2 * halfX * i / 120;
      const xb = -halfX + 2 * halfX * (i + 1) / 120;
      fixed.push(line([point(xa, u), point(xb, u)], u === 1 ? supportColor : excludedColor, u === 1 ? 2.8 : 2.4));
    }
  }
  const origin = [-halfX, -halfU, sMin];
  const axes = [
    { name: &#x27;x&#x27;, end: [halfX, -halfU, sMin], values: [-1, 0, 1], at: t =&gt; [t, -halfU, sMin] },
    { name: &#x27;u&#x27;, end: [-halfX, halfU, sMin], values: [-1, 0, 1], at: t =&gt; [-halfX, t, sMin] },
    { name: &#x27;s&#x27;, end: [-halfX, -halfU, sMax], values: [0, 1, 2], at: t =&gt; [-halfX, -halfU, t] }
  ];
  const corners = [];
  for (const x of [-halfX, halfX]) for (const u of [-halfU, halfU]) for (const s of [sMin, sMax]) corners.push([x, u, s]);
  function element(tag, attrs, text, parent = svg) {
    const e = document.createElementNS(ns, tag);
    for (const [key, item] of Object.entries(attrs)) e.setAttribute(key, item);
    if (text !== undefined) e.textContent = text;
    parent.appendChild(e);
    return e;
  }
  function round(value) { return Math.round(value * 100) / 100; }
  function render() {
    const width = stage.getBoundingClientRect().width || 320;
    const height = Math.max(340, Math.min(480, width * 0.68));
    const a = Number(azimuth.value) * Math.PI / 180;
    const e = Number(elevation.value) * Math.PI / 180;
    const s = Number(parameter.value);
    const cA = Math.cos(a), sA = Math.sin(a), cE = Math.cos(e), sE = Math.sin(e);
    function rotate(p) {
      const h = cA * p[0] + sA * p[1];
      const d = -sA * p[0] + cA * p[1];
      const z = p[2] - centreS;
      return [h, cE * z - sE * d, cE * d + sE * z];
    }
    const bounds = corners.map(rotate);
